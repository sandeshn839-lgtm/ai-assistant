<div class="sech">✦ LISTENING</div><div class="card"><label class="tg"><div><b>Listen when the app opens</b><br><small style="color:var(--t2)">Starts listening on your first tap after opening</small></div><input type="checkbox" ${p.listen?'checked':''} onchange="SP({listen:this.checked})"></label></div><button class="chip" onclick="speak('Hello! This is my voice.')">▶ Test voice</button>`},
memory:()=>`<div class="card"><b>${Object.keys(chats).length} saved chats</b><p style="color:var(--t2);font-size:13px;margin:6px 0">Each chat keeps its full history, and the last 30 messages are sent to the AI every time, so it remembers context.</p><button class="bt" onclick="if(confirm('Delete ALL chats?')){chats={};saveC();newChat();sub('memory')}">🗑 Delete all chats</button></div>`,
look:()=>`<div class="card pv"><canvas id="op" width="480" height="480"></canvas><h3 id="on"></h3><small id="od"></small><div class="fl c" id="chp"><button class="chip on" data-s="idle">Idle</button><button class="chip" data-s="listening">Listening</button><button class="chip" data-s="speaking">Speaking</button></div></div><p style="color:var(--t2);font-size:13px;margin:0 4px 12px">Pick the orb ${esc(P().name)} shows on Home, in voice mode and on the intro.</p><div class="g2">${Object.keys(ORB).map(k=>`<div class="oc" id="oc_${k}" onclick="setOrb('${k}')"><canvas width="180" height="180" data-o="${k}"></canvas><b>${cap(k)}</b><small>${ORB[k].d}</small></div>`).join('')}</div>`,
actions:()=>`<p style="color:var(--t2);margin-bottom:14px;font-size:14px">Tap one to start. Say it the way you would to a friend — Hindi, English or both.</p><div class="g2">${[['⌗','Open an app','"YouTube kholo"','app'],['📞','Call someone','"Mummy ko call karo"','call'],['💬','Send a message','"Papa ko WhatsApp karo"','msg'],['🌐','Build a website','"ek cafe ki website banao"','web'],['🖌','Sketch a photo','"drawing banao"','sk'],['🎙','Talk to '+esc(P().name),'Start a voice conversation','talk'],['✦','Ask anything','Start a text conversation','ask']].map(a=>`<div class="card qa" onclick="qa('${a[3]}')"><div class="ri">${a[0]}</div><b>${a[1]}</b><small>${a[2]}</small></div>`).join('')}</div>`,
admin:()=>{const U=L('lia_users',{}),g=L('lia_g',{m:0});return `<div class="card"><b>Users &amp; keys</b><table><tr><th>Email</th><th>Keys</th><th></th></tr>${Object.keys(U).map(e=>{const p=L('lia_p_'+e,{});return `<tr><td>${esc(e)}${isAdmin(e)?' 👑':''}${U[e].g?' (G)':''}</td><td>${keys(p.gk).length?'G ':''}${keys(p.qk).length?'Q×'+keys(p.qk).length:''}${!keys(p.gk).length&&!keys(p.qk).length?'—':''}</td><td><button class="chip" style="padding:3px 8px" onclick="admK('${esc(e)}')">Clear keys</button>${isAdmin(e)?'':` <button class="chip" style="padding:3px 8px;color:var(--er)" onclick="admD('${esc(e)}')">Delete</button>`}</td></tr>`}).join('')}</table></div>
<div class="card"><label class="tg"><div><b>Maintenance mode</b><br><small style="color:var(--t2)">Blocks non-admin logins</small></div><input type="checkbox" ${g.m?'checked':''} onchange="W('lia_g',{m:this.checked})"></label></div>
<div class="card"><b>System logs</b><table>${L('lia_log',[]).slice(0,20).map(l=>`<tr><td>${new Date(l.t).toLocaleTimeString()}</td><td>${esc(l.u)}</td><td>${esc(l.m)}</td></tr>`).join('')||'<tr><td>No logs</td></tr>'}</table><button class="chip" style="margin-top:8px" onclick="localStorage.removeItem('lia_log');sub('admin')">Clear logs</button></div><small style="color:var(--t3)">Admin gating is client-side only (localStorage) — not real security.</small>`}};
function saveK(t){SP({[t=='g'?'gk':'qk']:$('k'+t).value.trim()});log('saved '+t+' key');toast('Saved ✔');sub('connections')}
async function testK(t){const r=$('tr'+t),k=keys($('k'+t).value);if(!k.length){r.style.color='var(--or)';return r.textContent='⚠️ Paste a key first.'}r.style.color='var(--t2)';r.textContent='Testing…';
 const h=[{role:'user',content:'Reply with OK'}],res=await Promise.allSettled(k.map(x=>t=='g'?gem(x,h,'Reply OK',P().gm):groq(x,h,'Reply OK'))),ok=res.filter(x=>x.status=='fulfilled').length,bad=res.find(x=>x.status=='rejected');
 r.style.color=ok?'var(--ok)':'var(--er)';r.textContent=ok?`✅ ${ok}/${k.length} key(s) valid`:'❌ '+(/failed to fetch|networkerror|load failed/i.test(bad.reason.message)?netErr().message:bad.reason.message)}
function lookInit(){pv=addOrb($('op'),null,'idle');document.querySelectorAll('#sub canvas[data-o]').forEach(c=>addOrb(c,c.dataset.o,'idle'));document.querySelectorAll('#chp .chip').forEach(b=>b.onclick=()=>{pv.st=b.dataset.s;document.querySelectorAll('#chp .chip').forEach(x=>x.classList.toggle('on',x==b))});setOrb(P().orb,1)}
function setOrb(k,quiet){if(!quiet)SP({orb:k});$('on').textContent=cap(k);$('od').textContent=ORB[k].d;pv.style=k;document.querySelectorAll('#sub .oc').forEach(c=>c.classList.toggle('on',c.id=='oc_'+k))}
function admK(e){if(!isAdmin(me))return;const p=L('lia_p_'+e,{});p.gk='';p.qk='';W('lia_p_'+e,p);log('admin cleared keys '+e);sub('admin')}
function admD(e){if(!isAdmin(me)||!confirm('Delete '+e+'?'))return;const U=L('lia_users',{});delete U[e];W('lia_users',U);['lia_c_','lia_p_'].forEach(p=>localStorage.removeItem(p+e));W('lia_accts',L('lia_accts',[]).filter(x=>x!=e));log('admin deleted '+e);sub('admin')}

/* ================= QUICK ACTIONS ================= */
function qa(k){$('sub').classList.remove('on');
 if(k=='talk')return startCall();if(k=='ask')return tab('chat');if(k=='sk')return imgAsk(1);
 if(k=='app')return modal(`<h3>⌗ Open an app</h3><div class="fl">${Object.keys(APPS).map(a=>`<button class="chip" onclick="window.open('https://${APPS[a]}','_blank')">${a}</button>`).join('')}</div><small style="color:var(--t2)">Or type / say “YouTube kholo” in chat or voice mode.</small>`);
 if(k=='call')return modal(`<h3>📞 Call someone</h3><input class="in" id="cn_" type="tel" placeholder="Phone number"><a class="bt" href="#" onclick="this.href='tel:'+$('cn_').value.replace(/[^\\d+]/g,'')">Call now</a>`);
 if(k=='msg')return modal(`<h3>💬 Send a message</h3><input class="in" id="sph" placeholder="WhatsApp number (country code + digits)"><textarea class="in" id="smg" placeholder="Write your message…"></textarea><div class="fl"><button class="chip" onclick="sh('wa')">WhatsApp</button><button class="chip" onclick="sh('ig')">Instagram</button><button class="chip" onclick="sh('tg')">Telegram</button><button class="chip" onclick="sh('x')">X</button><button class="chip" onclick="sh('mail')">Email</button></div>`);
 if(k=='web')modal(`<h3>🌐 Build a website</h3><textarea class="in" id="wp" placeholder="e.g. a dark portfolio website with hero, projects and contact form"></textarea><button class="bt" onclick="web()">Generate</button><div id="wo"></div>`)}
function sh(k){const m=$('smg').value.trim(),e=encodeURIComponent(m),ph=($('sph').value||'').replace(/\D/g,'');if(!m)return toast('Write a message first');
 if(k=='ig'){navigator.clipboard.writeText(m).then(()=>toast('Copied — paste it in Instagram'));window.open('https://www.instagram.com/direct/inbox/','_blank')}else window.open({wa:`https://wa.me/${ph}?text=${e}`,tg:`https://t.me/share/url?url=%20&text=${e}`,x:`https://twitter.com/intent/tweet?text=${e}`,mail:`mailto:?body=${e}`}[k],'_blank')}
async function web(){const p=$('wp').value.trim();if(!p)return;$('wo').innerHTML='<div class="ld">Building your website…</div>';
 try{const o=await ai([{role:'user',content:p}],0,'You are a senior web developer. Output ONE complete, responsive, polished single-file index.html (inline CSS and JS) inside a single fenced code block, nothing else.');
 webCode=[...o.matchAll(/```[\w+-]*\n([\s\S]*?)```/g)].map(m=>m[1]).sort((a,b)=>b.length-a.length)[0]||o;
 $('wo').innerHTML='<iframe sandbox="allow-scripts allow-forms" style="width:100%;height:300px;border:0;border-radius:12px;background:#fff;margin-top:10px"></iframe><div class="fl"><button class="chip" onclick="navigator.clipboard.writeText(webCode);toast(\'Copied\')">Copy code</button><button class="chip" onclick="dlWeb()">Download</button></div>';$('wo').firstChild.srcdoc=webCode}catch(e){$('wo').textContent='⚠️ '+e.message}}
function dlWeb(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([webCode],{type:'text/html'}));a.download='website.html';a.click()}
function imgAsk(sk){modal(`<h3>🎨 ${sk?'Sketch a photo':'Create image'}</h3><textarea class="in" id="ip" placeholder="Describe it…"></textarea><button class="bt" onclick="img($('ip').value,${sk})">Generate</button>`)}
function img(p,sk){p=String(p||'').trim();if(!p)return toast('Describe an image first');modal(`<h3>🎨 ${sk?'Sketch':'Image'}</h3><div id="io" class="ld">Generating…</div>`);
 const q=(sk?'pencil sketch drawing of ':'')+p,seed=Math.random()*1e6|0,ms=['flux','turbo'];(function t(n){const i=new Image(),u=`https://image.pollinations.ai/prompt/${encodeURIComponent(q)}?width=1024&height=1024&model=${ms[n]}&seed=${seed}&nologo=true`;i.referrerPolicy='no-referrer';
 i.onload=()=>{$('io').className='';$('io').innerHTML='';$('io').append(i);$('io').insertAdjacentHTML('beforeend',`<a class="bt" href="${u}" target="_blank" rel="noopener">Open / Save</a>`)};i.onerror=()=>n?$('io').textContent='⚠️ Generation failed. Try again.':t(1);i.src=u})(0)}

/* ================= BOOT ================= */
setST('idle');
const cur=L('lia_cur',null);if(cur&&L('lia_users',{})[cur]){me=cur;$('app').classList.add('on');init()}else showAuth();
</script></body></html>
